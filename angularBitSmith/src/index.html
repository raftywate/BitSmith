<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Compylr</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Compylr is a modern coding practice workspace with submissions, community solutions, and discussion flows." />
  <meta name="theme-color" content="#0b766f" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" href="/logo-light-32.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="/logo-dark-32.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/logo-light-180.png" media="(prefers-color-scheme: light)">
  <link rel="apple-touch-icon" href="/logo-dark-180.png" media="(prefers-color-scheme: dark)">
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('compylr.theme');
        var preference = (stored && ['light', 'dark', 'black', 'system'].indexOf(stored) !== -1) ? stored : 'system';
        var resolved = preference;
        if (preference === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset['theme'] = resolved;
        document.documentElement.style.colorScheme = resolved === 'light' ? 'light' : 'dark';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
